<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>10-Point Tasting Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
    <!-- Home screen (Add to Home Screen) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icon-180.png">
    <meta name="theme-color" content="#2f4a6d">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="10点採点">
</head>

<body>
    <div class="background-gradient"></div>
    <div class="global-controls">
        <h1 class="app-title">10-Point Tasting Calculator</h1>
        <div style="display: flex; gap: 10px; flex-wrap: wrap;">
            <button id="help-btn" class="btn-help" title="使い方">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                    <circle cx="12" cy="17" r="0.5" fill="currentColor"></circle>
                </svg>
                使い方
            </button>
            <button id="reset-btn" class="btn-secondary" title="データをリセット">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <polyline points="23 20 23 14 17 14"></polyline>
                    <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"></path>
                </svg>
                リセット
            </button>
            <button id="backup-btn" class="btn-secondary" title="バックアップの保存・読み込み">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                    <polyline points="7 3 7 8 15 8"></polyline>
                </svg>
                バックアップ
            </button>
            <button id="export-btn" class="btn-primary">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                結果を出力
            </button>
        </div>
    </div>
    <div class="sets-container">
        <!-- Set 1 -->
        <div class="glass-container" id="set-1">
            <header>
                <div class="header-content">
                    <div>
                        <input type="text" class="set-title" id="title-1" value="総合評価" placeholder="セット名">
                        <p class="subtitle">10点満点で評価</p>
                    </div>
                    <div class="header-buttons">
                        <button id="copy-btn-1" class="btn-copy" title="ワイン名をコピー">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>
                        <button id="distribute-btn-1" class="btn-icon-header" title="点数を均等に割り振る">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="M3 6h18"></path>
                                <path d="M3 12h18"></path>
                                <path d="M3 18h18"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </header>

            <main>
                <div class="score-summary">
                    <div class="score-card">
                        <span class="label">合計点</span>
                        <span class="value" id="total-score-1">0.00</span>
                        <span class="target">/ 10.00</span>
                    </div>
                    <div class="status-message" id="status-message-1">
                        合計10.00点になるよう調整してください
                    </div>
                </div>

                <div class="wine-list" id="wine-list-1">
                    <!-- Wine items will be injected here -->
                </div>

                <div class="controls">
                    <button id="add-wine-btn-1" class="btn-primary">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2">
                            <line x1="12" y1="5" x2="12" y2="19"></line>
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                        </svg>
                        ワインを追加
                    </button>
                </div>
            </main>
        </div>
